<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <marker id="arrow-large" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Top row -->
  <rect class="box" x="60" y="70" width="180" height="60" />
  <text class="title" x="150" y="105" text-anchor="middle">User</text>

  <rect class="box" x="280" y="70" width="240" height="60" />
  <text class="title" x="400" y="95" text-anchor="middle">React SPA</text>
  <text class="label" x="400" y="115" text-anchor="middle">Browser UI</text>

  <rect class="box" x="580" y="60" width="280" height="80" />
  <text class="title" x="720" y="95" text-anchor="middle">FastAPI Backend</text>
  <text class="label" x="720" y="118" text-anchor="middle">REST + JWT</text>

  <!-- Arrows top row -->
  <line class="arrow" x1="240" y1="100" x2="280" y2="100" marker-end="url(#arrow)" />
  <line class="arrow" x1="520" y1="100" x2="580" y2="100" marker-end="url(#arrow)" />

  <!-- API Modules -->
  <rect class="box" x="580" y="180" width="280" height="50" />
  <text class="title" x="720" y="210" text-anchor="middle">Auth + JWT</text>

  <rect class="box" x="580" y="240" width="280" height="50" />
  <text class="title" x="720" y="270" text-anchor="middle">Wardrobe</text>
  <text class="label" x="720" y="288" text-anchor="middle">upload, detect, list, search, filter</text>

  <rect class="box" x="580" y="310" width="280" height="50" />
  <text class="title" x="720" y="340" text-anchor="middle">Recommendations</text>
  <text class="label" x="720" y="358" text-anchor="middle">occasion, pair-with, today</text>

  <rect class="box" x="580" y="380" width="280" height="50" />
  <text class="title" x="720" y="410" text-anchor="middle">Color Harmony</text>

  <rect class="box" x="580" y="450" width="280" height="50" />
  <text class="title" x="720" y="480" text-anchor="middle">Weather Service</text>

  <rect class="box" x="580" y="520" width="280" height="50" />
  <text class="title" x="720" y="550" text-anchor="middle">Weather Clothing</text>

  <rect class="box" x="580" y="590" width="280" height="50" />
  <text class="title" x="720" y="620" text-anchor="middle">Image Serving</text>

  <!-- Arrows from API to modules -->
  <line class="arrow" x1="720" y1="140" x2="720" y2="180" marker-end="url(#arrow-large)" />
  <line class="arrow" x1="720" y1="230" x2="720" y2="240" marker-end="url(#arrow)" />
  <line class="arrow" x1="720" y1="290" x2="720" y2="310" marker-end="url(#arrow)" />
  <line class="arrow" x1="720" y1="360" x2="720" y2="380" marker-end="url(#arrow)" />
  <line class="arrow" x1="720" y1="430" x2="720" y2="450" marker-end="url(#arrow)" />
  <line class="arrow" x1="720" y1="500" x2="720" y2="520" marker-end="url(#arrow)" />
  <line class="arrow" x1="720" y1="570" x2="720" y2="590" marker-end="url(#arrow)" />

  <!-- Right-side dependencies -->
  <rect class="box" x="980" y="190" width="300" height="60" />
  <text class="title" x="1130" y="220" text-anchor="middle">SQLite Database</text>
  <text class="label" x="1130" y="240" text-anchor="middle">SQLAlchemy ORM</text>

  <rect class="box" x="980" y="290" width="300" height="60" />
  <text class="title" x="1130" y="320" text-anchor="middle">Local File Storage</text>
  <text class="label" x="1130" y="340" text-anchor="middle">uploads + profile images</text>

  <rect class="box" x="980" y="390" width="300" height="60" />
  <text class="title" x="1130" y="420" text-anchor="middle">Image Analysis</text>
  <text class="label" x="1130" y="440" text-anchor="middle">rembg + PIL + MobileNetV2</text>

  <rect class="box" x="980" y="520" width="300" height="60" />
  <text class="title" x="1130" y="550" text-anchor="middle">OpenWeatherMap API</text>

  <!-- Dependency arrows -->
  <line class="arrow" x1="860" y1="205" x2="980" y2="220" marker-end="url(#arrow-large)" />
  <line class="arrow" x1="860" y1="265" x2="980" y2="220" marker-end="url(#arrow)" />
  <line class="arrow" x1="860" y1="335" x2="980" y2="220" marker-end="url(#arrow)" />
  <line class="arrow" x1="860" y1="410" x2="980" y2="220" marker-end="url(#arrow)" />

  <line class="arrow" x1="860" y1="265" x2="980" y2="320" marker-end="url(#arrow)" />
  <line class="arrow" x1="860" y1="615" x2="980" y2="320" marker-end="url(#arrow)" />
  <line class="arrow" x1="860" y1="265" x2="980" y2="420" marker-end="url(#arrow)" />

  <line class="arrow" x1="860" y1="480" x2="980" y2="550" marker-end="url(#arrow)" />
  <line class="arrow" x1="860" y1="550" x2="980" y2="550" marker-end="url(#arrow)" />
</svg>
